name: Deploy to Cloudflare

on:
  push:
    branches: [claude/swampkat-online-game-wuc3kt, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken content table shouldn't reach the live game.
      - run: npm test

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The Discord bot API answers 503 until this is set, so a missing secret is safe --
      # it leaves the endpoints closed rather than open.
      - name: Sync the bot token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.DOGDLE_BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "DOGDLE_BOT_TOKEN is not set; leaving /api/bot/* closed"
            exit 0
          fi
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
