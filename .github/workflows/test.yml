name: Test

# deploy.yml runs the tests, but only on a push to a branch that deploys, so a pull
# request got no checks at all. This runs the same suite on every PR and deploys nothing.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run for the old one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
