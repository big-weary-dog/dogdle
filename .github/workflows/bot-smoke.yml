name: Smoke-test the bot API

# Hits the live Worker from outside Cloudflare, the way Felfox's bot will, using mock
# Discord users. Every roll is sent with `"test": true`, so it stays off the leaderboards
# and everything it writes expires in 48 hours -- nothing to clean up afterwards.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Origin to test against
        default: https://dogdle.swampkat.com
        required: true

env:
  GUILD: "900000000000000009"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.DOGDLE_BOT_TOKEN }}
      BASE: ${{ inputs.base }}
    steps:
      - name: Write the helpers
        run: |
          # Anything that isn't a 2xx JSON body gets dumped in full: a failure here is as
          # likely to be Cloudflare in front of the Worker as the Worker itself, and a
          # JSON parse error tells you nothing about which.
          cat > /tmp/call.sh <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          out=$1; shift
          code=$(curl -sS -o "$out" -D /tmp/headers.txt -w '%{http_code}' "$@")
          if [ "$code" != "200" ]; then
            echo "--- HTTP $code ---"
            cat /tmp/headers.txt
            echo "--- body (first 1500 bytes) ---"
            head -c 1500 "$out"; echo
            exit 22
          fi
          SH
          chmod +x /tmp/call.sh

          cat > /tmp/roll.py <<'PY'
          import json, sys
          d = json.load(sys.stdin)
          if "error" in d:
              print("ERROR:", d); sys.exit(1)
          print(f'{d["name"]} the {d["breed"]} -- {d["quality"]} ({d["score"]:+d})')
          print(f'  rarity   {d["rarity"]}')
          print(f'  replayed {d["replayed"]}')
          print(f'  image    {d["image"]}')
          bg = d["background"]
          print(f'  {bg["emoji"]} {bg["name"]:<34} {bg["value"]:+d}')
          for t in d["traits"]:
              print(f'  {t["emoji"]} {t["text"]:<34} {t["value"]:+d}')
          PY

          cat > /tmp/board.py <<'PY'
          import json, sys
          d = json.load(sys.stdin)
          rows = d.get("rows", [])
          print(f'{len(rows)} row(s)')
          for r in rows:
              flag = "  [test]" if r.get("test") else ""
              player = r.get("player") or "(anon)"
              print(f'  {player:<14} {r["emoji"]} {r["dog"]} the {r["breed"]:<26} {r["score"]:+3d}  {r["quality"]}{flag}')
          PY

          cat > /tmp/gif.py <<'PY'
          import sys
          b = open(sys.argv[1], "rb").read()
          assert b[:6] == b"GIF89a", "not a GIF"
          print(f'  {b[6] | b[7] << 8}x{b[8] | b[9] << 8}, {len(b)} bytes, header ok')
          PY

      - name: Roll three mock users
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "DOGDLE_BOT_TOKEN is not set on this repo"; exit 1; fi

          echo "=== GET / (is the Worker reachable at all?) ==="
          curl -sS -o /dev/null -w '  http %{http_code} in %{time_total}s\n' "$BASE/"

          for pair in 900000000000000001:mock-alpha 900000000000000002:mock-bravo 900000000000000003:mock-charlie; do
            id=${pair%%:*}; name=${pair##*:}
            echo "=== POST /api/bot/roll  ($name) ==="
            /tmp/call.sh "/tmp/$name.json" -X POST "$BASE/api/bot/roll" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'content-type: application/json' \
              -d "{\"discordId\":\"$id\",\"guildId\":\"$GUILD\",\"displayName\":\"$name\",\"test\":true}"
            python3 /tmp/roll.py < "/tmp/$name.json"
            echo
          done

      - name: Rolling again must replay, not re-deal
        run: |
          set -euo pipefail
          curl -sS -X POST "$BASE/api/bot/roll" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "{\"discordId\":\"900000000000000001\",\"guildId\":\"$GUILD\",\"test\":true}" \
            > /tmp/again.json
          python3 -c "
          import json
          a = json.load(open('/tmp/mock-alpha.json')); b = json.load(open('/tmp/again.json'))
          print('first :', a['text'], '| replayed', a['replayed'])
          print('second:', b['text'], '| replayed', b['replayed'])
          assert b['replayed'] is True and b['name'] == a['name'] and b['score'] == a['score'], 'RE-DEALT!'
          print('same dog, no reroll')"

      - name: Read the boards
        run: |
          set -euo pipefail
          for q in "?guildId=$GUILD&includeTest=1" "?guildId=$GUILD" ""; do
            echo "=== GET /api/bot/leaderboard$q ==="
            curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/api/bot/leaderboard$q" | python3 /tmp/board.py
            echo
          done

          echo "=== GET /api/bot/dog (peek, deals nothing) ==="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/api/bot/dog?discordId=900000000000000002" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['text']); print(d['image'])"
          echo

          echo "=== GET /api/bot/history ==="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/api/bot/history?discordId=900000000000000002" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['rows'])"
          echo

          echo "=== no token, and a wrong one (both must be 401) ==="
          curl -sS -o /dev/null -w '  none : http %{http_code}\n' "$BASE/api/bot/leaderboard"
          curl -sS -o /dev/null -w '  wrong: http %{http_code}\n' -H "Authorization: Bearer nope" "$BASE/api/bot/leaderboard"

      - name: Fetch the rendered cards
        run: |
          set -euo pipefail
          mkdir -p cards
          for name in mock-alpha mock-bravo mock-charlie; do
            URL=$(python3 -c "import json;print(json.load(open('/tmp/$name.json'))['image'])")
            echo "=== $name  $URL ==="
            curl -sS -o "cards/$name.gif" -w '  http %{http_code}  %{content_type}  %{time_total}s\n' "$URL"
            python3 /tmp/gif.py "cards/$name.gif"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bot-cards
          path: cards/
