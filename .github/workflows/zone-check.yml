name: Check zone security

# Read-only. Reports which Cloudflare zone settings sit in front of the Worker -- a bot
# calling /api/bot/* is not a browser, so a challenge anywhere in this list blocks it
# before the Worker ever runs.
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail

          cat > /tmp/show.py <<'PY'
          import json, sys
          d = json.load(sys.stdin)
          if not d.get("success"):
              print("  not permitted / error:", json.dumps(d.get("errors")))
              sys.exit(0)
          r = d["result"]
          if isinstance(r, dict) and "rules" in r:
              for rule in r["rules"]:
                  print(f'  [{rule["action"]}] {rule.get("description", "")}')
                  print(f'      {rule["expression"]}')
              if not r["rules"]:
                  print("  (none)")
          elif isinstance(r, dict) and "value" in r:
              print(f'  {r["id"]} = {r["value"]}')
          else:
              print("  " + json.dumps(r, indent=2).replace("\n", "\n  "))
          PY

          cat > /tmp/zone.py <<'PY'
          import json, sys
          d = json.load(sys.stdin)
          if not d.get("success") or not d["result"]:
              print("ERROR:", json.dumps(d.get("errors")), file=sys.stderr)
              sys.exit(1)
          print(d["result"][0]["id"])
          PY

          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          ZONE=$(api "/zones?name=swampkat.com" | python3 /tmp/zone.py)
          echo "zone: $ZONE"
          echo

          for s in security_level challenge_ttl browser_check; do
            echo "=== setting: $s ==="
            api "/zones/$ZONE/settings/$s" | python3 /tmp/show.py
          done

          echo "=== bot management ==="
          api "/zones/$ZONE/bot_management" | python3 /tmp/show.py

          for phase in http_request_firewall_custom http_request_firewall_managed; do
            echo "=== ruleset: $phase ==="
            api "/zones/$ZONE/rulesets/phases/$phase/entrypoint" | python3 /tmp/show.py
          done
