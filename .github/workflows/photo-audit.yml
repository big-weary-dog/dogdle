name: Audit stored photos

# A dog's photo URL is fetched once, at roll time, and stored inside the roll -- and rolls
# are immutable, so a Dog CEO hiccup bakes a photo-less dog in for that player's whole day.
# This reports how often that has actually happened, and digs into one player by name.
#
# Read-only.
on:
  workflow_dispatch:
    inputs:
      player:
        description: Display name to look at in detail
        default: megapwn
        required: false
      repair:
        description: Also re-request the photo for affected Discord players
        default: "false"
        required: false

env:
  NS: 4c634ff1e5fd4d3ca547c5a2f1119806

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WANTED: ${{ inputs.player }}
        run: |
          set -euo pipefail

          echo "=== every stored roll ==="
          npx wrangler kv key list --namespace-id="$NS" --prefix="roll:" --remote > rolls.json
          node -e 'console.log("keys:", require("./rolls.json").length)'

          # Fetch each roll's value and report whether it carries a photo. Values are small
          # and there are not many players; this is the only way to see photo state, since
          # it lives in the value rather than the metadata.
          node -e '
            const keys = require("./rolls.json").map(k => k.name);
            console.log(keys.join("\n"));
          ' > keynames.txt

          : > values.jsonl
          while read -r key; do
            [ -z "$key" ] && continue
            value=$(npx wrangler kv key get --namespace-id="$NS" --remote "$key" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              printf '{"key":%s,"value":%s}\n' "$(node -e 'console.log(JSON.stringify(process.argv[1]))' "$key")" "$value" >> values.jsonl
            fi
          done < keynames.txt

          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync("values.jsonl", "utf8").trim().split("\n")
              .filter(Boolean).map(l => JSON.parse(l));

            const missing = rows.filter(r => !r.value.photo);
            console.log("\n=== photo state across every stored roll ===");
            console.log("rolls with a photo   :", rows.length - missing.length);
            console.log("rolls with NO photo  :", missing.length);

            if (missing.length) {
              console.log("\naffected:");
              for (const r of missing) {
                const d = r.value;
                console.log(`  ${r.key}`);
                console.log(`      player=${JSON.stringify(d.player)} dog=${d.name} breed=${d.breed} slug=${d.breedSlug} photo=${JSON.stringify(d.photo)}`);
              }
              // Probe every breed that lost a photo, not just one named player: if they share a
              // slug the cause is that breed, not a flaky moment.
              const slugs = [...new Set(missing.map(r => r.value.breedSlug))];
              console.log("\ndistinct breeds among them:", slugs.join(", "));
              for (const s of slugs) fs.appendFileSync("probe.txt", `${s}\t\n`);

              // Discord rolls can be repaired from here; web ones repair when the player
              // next loads the page, which needs nobody.
              for (const r of missing) {
                const m = r.key.match(/^roll:discord-(\d+):/);
                if (m && !r.value.test) fs.appendFileSync("broken-discord.txt", m[1] + "\n");
              }
            }

            const wanted = (process.env.WANTED || "").toLowerCase();
            const mine = rows.filter(r => String(r.value.player || "").toLowerCase() === wanted);
            console.log(`\n=== rolls belonging to ${JSON.stringify(process.env.WANTED)} ===`);
            if (!mine.length) {
              console.log("  none found -- names seen:",
                [...new Set(rows.map(r => r.value.player).filter(Boolean))].join(", "));
            }
            for (const r of mine) {
              const d = r.value;
              console.log(`  ${r.key}`);
              console.log(`      ${d.name} the ${d.breed} (${d.rarity}) score ${d.score}`);
              console.log(`      slug  : ${d.breedSlug}`);
              console.log(`      photo : ${JSON.stringify(d.photo)}`);
              fs.appendFileSync("probe.txt", `${d.breedSlug}\t${d.photo || ""}\n`);
            }
          '

          echo "=== are those breeds and photos reachable right now? ==="
          if [ -f probe.txt ]; then
            while IFS=$'\t' read -r slug photo; do
              [ -z "$slug" ] && continue
              echo "--- $slug ---"
              # Print the body: dog.ceo answers 404 with a JSON message naming the problem.
              curl -sS -w "\n  [http %{http_code} in %{time_total}s]\n" \
                "https://dog.ceo/api/breed/$slug/images/random" | head -c 400 || true
              if [ -n "$photo" ]; then
                curl -sS -o /dev/null -w "  stored photo    : http %{http_code}\n" "$photo" || true
              else
                echo "  stored photo    : (none stored)"
              fi
            done < probe.txt
          fi

      # Repairing is a read on the live Worker: /api/bot/roll is idempotent, so for a
      # player who has already rolled it returns the same dog and backfills the photo.
      # It cannot deal anybody a dog they do not already have.
      - name: Repair the Discord ones
        if: ${{ inputs.repair == 'true' }}
        env:
          TOKEN: ${{ secrets.DOGDLE_BOT_TOKEN }}
          BASE: https://dogdle.swampkat.com
        run: |
          set -uo pipefail
          [ -f broken-discord.txt ] || { echo "nothing to repair"; exit 0; }
          while read -r id; do
            [ -z "$id" ] && continue
            echo "--- discord $id ---"
            curl -sS -X POST "$BASE/api/bot/roll" \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              -d "{\"discordId\":\"$id\"}" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('  ', d.get('text'))
          print('   replayed:', d.get('replayed'))
          print('   image   :', d.get('image'))
          "
          done < broken-discord.txt
