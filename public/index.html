<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dogdle</title>
  <meta name="description" content="One dog. Once a day. No rerolls." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐕</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Dogdle</h1>
      <p class="tagline">One dog. Once a day. No rerolls. <span class="beta">BETA</span></p>
    </header>

    <section class="stage" id="stage">
      <canvas id="sceneBack"></canvas>
      <div class="dog-slot" id="dogSlot">
        <div class="spinner" id="spinner">🐾</div>
        <img id="dogPhoto" alt="" hidden />
      </div>
      <canvas id="sceneFront"></canvas>
      <div class="badges" id="badges"></div>
      <div class="scene-label" id="sceneLabel" hidden></div>
    </section>

    <div class="name-field">
      <div class="name-row-input">
        <input id="nameInput" type="text" maxlength="20" placeholder="Name for the leaderboard"
               aria-label="Your name on the leaderboard"
               autocomplete="off" autocapitalize="off" spellcheck="false" name="dogdle-handle" />
        <button id="nameBtn" type="button">Set name</button>
      </div>
      <span class="name-saved" id="nameSaved" hidden></span>
    </div>

    <button id="pullBtn" class="pull-btn">Pull the lever</button>

    <section class="result" id="result" hidden>
      <div class="name-row">
        <h2 id="dogName"></h2>
        <span class="rarity-badge" id="rarityBadge"></span>
      </div>
      <p class="breed" id="breedName"></p>

      <div class="score-row">
        <span class="quality" id="qualityLabel"></span>
        <span class="score" id="scoreValue"></span>
      </div>

      <ul class="modifiers" id="modifiersList"></ul>

      <button id="shareBtn" class="share-btn">Copy share card</button>
      <p class="next-roll" id="nextRoll"></p>
    </section>

    <section class="board" id="board">
      <div class="board-tabs">
        <button class="tab active" id="tabToday" type="button">Today</button>
        <button class="tab" id="tabMine" type="button">My dogdles</button>
      </div>
      <ol class="board-list" id="boardList"></ol>
    </section>

    <footer>photos from dog.ceo</footer>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
