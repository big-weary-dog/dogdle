name = "dogdle"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Must stay above [assets]: TOML assigns every key after a table header to that table,
# so down there this silently became assets.routes and was ignored.
routes = [{ pattern = "dogdle.swampkat.com", custom_domain = true }]

# The bot's way in. The swampkat.com zone challenges automated traffic -- every request
# shape we tried, browser headers included, came back 403 with cf-mitigated: challenge,
# which a bot can't solve. workers.dev hits the same Worker without the zone's WAF in
# front, so the Discord bot uses this hostname and players keep the pretty one.
workers_dev = true
# Enabling workers.dev turns these on by default, which would publish every past version
# at its own hostname. Nothing needs that.
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Rolled dogs, leaderboard entries and rendered share cards, separated by key prefix.
[[kv_namespaces]]
binding = "STORE"
id = "4c634ff1e5fd4d3ca547c5a2f1119806"
